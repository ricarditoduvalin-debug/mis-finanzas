<style>
:root{
  --navy:#0B2545;--navy2:#13315C;--navy3:#1E4E8C;--navyClaro:#E8EEF6;
  --gris:#5F6B7A;--gris2:#8D99AE;--gris3:#C5CCD6;--fondo:#F3F5F8;--linea:#DDE2E8;--blanco:#FFFFFF;--texto:#1B2430;
  --verde:#1E8E5A;--verdeOsc:#14663F;--verdeClaro:#E3F4EC;
  --ambar:#B7791F;--ambarClaro:#FDF3E1;--rojo:#C0392B;--rojoClaro:#FBE9E7;
  --radio:12px;--sombra:0 1px 2px rgba(11,37,69,.06),0 2px 8px rgba(11,37,69,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Portada */
#portada{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:50;padding:24px;cursor:pointer}
#portada h1{color:#fff;font-weight:600;font-size:clamp(26px,6vw,46px);text-align:center;letter-spacing:.5px;margin:0;line-height:1.25}
#portada .entrar{width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
#portada .entrar svg{width:24px;height:24px;stroke:#fff}
#portada .entrar:hover{background:rgba(255,255,255,.08)}

/* Estructura */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.lateral{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.lateral .marca{font-weight:600;font-size:15px;padding:6px 12px 18px;opacity:.95}
.lateral button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D6E0EE;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}
.lateral button:hover{background:rgba(255,255,255,.07);color:#fff}
.lateral button.activo{background:var(--navy3);color:#fff}
.lateral svg,.inferior svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.principal{min-width:0;display:flex;flex-direction:column}
.superior{position:sticky;top:0;z-index:10;background:var(--blanco);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:12px;padding:12px 24px}
.superior h2{margin:0;font-size:18px;font-weight:600;color:var(--navy);flex:1}
.estado-sync{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--fondo);color:var(--gris);border:1px solid var(--linea);cursor:pointer;white-space:nowrap}
.estado-sync.ok{background:var(--verdeClaro);color:var(--verdeOsc);border-color:#BFE3CF}
.estado-sync.pend{background:var(--ambarClaro);color:#7A4E0E;border-color:#F0D9AE}
.estado-sync.err{background:var(--rojoClaro);color:#8E2A20;border-color:#F2C4BD}
.contenido{padding:22px 24px 100px;max-width:1180px;width:100%}
.inferior{display:none}

@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .lateral.abierto{transform:none}
  .velo{position:fixed;inset:0;background:rgba(11,37,69,.35);z-index:35}
  .superior{padding:12px 16px}
  .contenido{padding:16px 14px 110px}
  .inferior{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--blanco);border-top:1px solid var(--linea);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .inferior button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gris);padding:4px 0;cursor:pointer}
  .inferior button.activo{color:var(--navy3);font-weight:600}
}

.btn-icono{background:none;border:0;padding:6px;cursor:pointer;color:var(--navy);display:inline-flex}
.btn-icono.solo-movil{display:none}
@media (max-width:899px){.btn-icono.solo-movil{display:inline-flex}}
.btn-icono svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* Componentes */
.rejilla{display:grid;gap:14px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:899px){.r3,.r4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.r2,.r3{grid-template-columns:1fr}}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);min-width:0}
.tarjeta h3{margin:0 0 12px;font-size:15.5px;font-weight:600;color:var(--navy)}
.tarjeta h4{margin:14px 0 8px;font-size:13.5px;font-weight:600;color:var(--gris);text-transform:none}
.seccion{margin:22px 0 10px;font-size:15px;font-weight:600;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:10px}
.seccion:first-child{margin-top:0}
.kpi .etq{font-size:12.5px;color:var(--gris)}
.kpi .val{font-size:22px;font-weight:600;color:var(--navy);margin-top:2px}
.kpi .sub{font-size:12px;color:var(--gris2);margin-top:2px}
.kpi.verde .val{color:var(--verde)}.kpi.rojo .val{color:var(--rojo)}.kpi.ambar .val{color:var(--ambar)}
.muted{color:var(--gris);font-size:13px}
.peq{font-size:12.5px;color:var(--gris)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linea)}
.lista li:first-child{border-top:0}
.lista .crece{flex:1;min-width:0}
.lista .tit{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.lista .monto{font-weight:600;white-space:nowrap}
.pos{color:var(--verde)}.neg{color:var(--rojo)}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--navyClaro);color:var(--navy2);white-space:nowrap}
.chip.verde{background:var(--verdeClaro);color:var(--verdeOsc)}
.chip.ambar{background:var(--ambarClaro);color:#7A4E0E}
.chip.rojo{background:var(--rojoClaro);color:#8E2A20}
.chip.gris{background:#ECEFF3;color:var(--gris)}
.barra{height:8px;background:#E6EAF0;border-radius:999px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:999px;background:var(--verde)}
.barra.ambar i{background:var(--ambar)}.barra.rojo i{background:var(--rojo)}.barra.navy i{background:var(--navy3)}
.aviso{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.aviso.rojo{background:var(--rojoClaro);color:#7E241B}
.aviso.ambar{background:var(--ambarClaro);color:#6B440C}
.aviso.verde{background:var(--verdeClaro);color:var(--verdeOsc)}
.aviso.azul{background:var(--navyClaro);color:var(--navy2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--gris);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--linea)}
td{padding:8px 6px;border-bottom:1px solid var(--linea);vertical-align:top}
td.der,th.der{text-align:right}
.tabla-scroll{overflow-x:auto}

/* Formularios */
form.formulario{display:grid;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label{font-size:12.5px;font-weight:600;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1px solid var(--gris3);border-radius:8px;padding:10px 11px;background:#fff;width:100%;min-height:42px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid #9DB8DB;border-color:var(--navy3)}
.campo .error{color:var(--rojo);font-size:12.5px}
.botones{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;min-height:42px}
.btn:hover{background:var(--navy2)}
.btn.verde{background:var(--verde)}.btn.verde:hover{background:var(--verdeOsc)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--gris3)}
.btn.sec:hover{background:var(--fondo)}
.btn.peq{padding:6px 10px;min-height:32px;font-size:13px}
.btn.rojo{background:#fff;color:var(--rojo);border:1px solid #F2C4BD}
.btn-link{background:none;border:0;color:var(--navy3);cursor:pointer;padding:2px 4px;font-size:13px}
.btn-link.rojo{color:var(--rojo)}
.vista-previa{border:1px dashed var(--gris3);border-radius:10px;padding:10px 12px;font-size:13.5px;background:#FAFBFC}

/* Modal y aviso */
#modal{position:fixed;inset:0;background:rgba(11,37,69,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){#modal{align-items:center}}
#modal .caja{background:#fff;border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
@media (min-width:640px){#modal .caja{border-radius:16px}}
#modal h3{margin:0 0 12px;color:var(--navy);font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.ver{opacity:1}
</style>
</head>

const ordenFecha = (a,b) => a.fecha<b.fecha?-1:a.fecha>b.fecha?1:((a.creado||'')<(b.creado||'')?-1:1);

function entidades(){

}

/* ============================================================
   CÁLCULO DE SALDOS
   ============================================================ */
function ultimoAjuste(e,hasta){
  return activos().filter(r=>r.tipo==='ajuste'&&r.entidad===e.id&&r.fecha>=e.fechaBase&&r.fecha<=hasta).sort(ordenFecha).pop();
}
function efecto(r,e){
  if(e.clase==='cuenta'){
    if(r.tipo==='ingreso'&&r.cuenta===e.id) return r.monto;
    if(r.tipo==='egreso'&&r.cuenta===e.id&&r.medio!=='Tarjeta de crédito') return -r.monto;
    if(r.tipo==='pago'&&r.cuenta===e.id) return -r.monto;
    if(r.tipo==='ahorro'&&r.cuenta===e.id) return r.retiro?r.monto:-r.monto;
    if(r.tipo==='traspaso'){ if(r.origen===e.id)return -r.monto; if(r.destino===e.id)return r.monto; }
    return 0;
  }
  if(e.clase==='tarjeta'){
    if(r.tipo==='egreso'&&r.medio==='Tarjeta de crédito'&&r.tarjeta===e.id) return r.monto;
    if(r.tipo==='pago'&&r.entidad===e.id) return -r.monto;
    return 0;
  }
  if(e.clase==='prestamo'){
    if(r.tipo!=='pago'||r.entidad!==e.id) return 0;
    if(e.modo==='fijo') return 0;
    if(e.modo==='interes') return r.clase==='extra'?-r.monto:0;
    return -r.monto;
  }
  return 0;
}
function saldo(e,hasta){
  hasta=hasta||hoy();
  let s=e.saldo, base=e.fechaBase;
  const aj=ultimoAjuste(e,hasta);
  if(aj){s=aj.saldoReal; base=aj.fecha;}
  activos().filter(r=>r.tipo!=='ajuste'&&r.fecha>base&&r.fecha<=hasta).forEach(r=>{s+=efecto(r,e);});
  return r2(s);
}
function fechaConciliacion(e){const aj=ultimoAjuste(e,'9999-12-31');return aj?aj.fecha:e.fechaBase;}
function utilizacion(e,s){ s=s??saldo(e); return e.limite?s/e.limite*100:0; }
function colorUtil(u){ return u<30?'verde':u<=70?'ambar':'rojo'; }
function compraDespuesCorte(e){
  if(!e.corte) return 0;
  const h=parse(hoy()); let c=new Date(h.getFullYear(),h.getMonth(),Math.min(e.corte,new Date(h.getFullYear(),h.getMonth()+1,0).getDate()));
  if(c>h) c=new Date(h.getFullYear(),h.getMonth()-1,e.corte);
  const fc=ymd(c);
  return activos().filter(r=>r.tipo==='egreso'&&r.medio==='Tarjeta de crédito'&&r.tarjeta===e.id&&r.fecha>fc).reduce((a,r)=>a+r.monto,0);
}

/* ============================================================
   CALENDARIO DE PAGOS
   ============================================================ */
function ocurrencias(e,hasta){
  if(!e.dias||!e.dias.length) return [];
  const out=[]; let d=parse(e.fechaBase); d=new Date(d.getFullYear(),d.getMonth(),1);
  const fin=e.fin&&e.fin<hasta?e.fin:hasta;
  while(ymd(d)<=fin){
    const y=d.getFullYear(),m=d.getMonth(),dim=new Date(y,m+1,0).getDate();
    e.dias.forEach(dd=>{const f=ymd(new Date(y,m,Math.min(dd,dim))); if(f>e.fechaBase&&f<=fin) out.push(f);});
    d=new Date(y,m+1,1);
  }
  return out.sort();
}
function montoSugerido(e){
  if(e.modo==='interes') return r2(saldo(e)*e.tasaMensual/100);
  if(e.clase==='tarjeta'){ const s=saldo(e); return r2(Math.max(0,Math.min(s,e.pagoSugerido||s))); }
  if(e.modo==='total') return r2(Math.min(saldo(e),e.pago));
  return e.pagoSugerido||e.pago||0;
}
function calendario(hasta){
  hasta=hasta||addDays(hoy(),45);
  const t=hoy(), out=[];
  entidades().filter(e=>e.dias&&e.dias.length).forEach(e=>{
    const occ=ocurrencias(e,hasta);
    const pagos=activos().filter(r=>r.tipo==='pago'&&r.entidad===e.id&&r.clase!=='extra'&&r.fecha>e.fechaBase).sort(ordenFecha);
    const usados=new Set(); const s=saldo(e);
    occ.forEach(f=>{
      const p=pagos.find(p=>!usados.has(p.id)&&p.fecha>=addDays(f,-15));
      if(p){usados.add(p.id); out.push({f,e,estado:'pagado',pago:p}); return;}
      if(s<=0.5&&e.modo!=='fijo'&&e.modo!=='interes') return;
      const est=f<t?'vencido':(diasEntre(t,f)<=3?'pronto':'programado');
      out.push({f,e,estado:est,monto:montoSugerido(e)});
    });
  });
  return out.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
}

/* ============================================================
   PLAN AVALANCHA (simulación mensual)
   ============================================================ */
function simular(presupuesto, metodo, extra){
  extra=extra||{};
  const deudas=entidades().filter(e=>e.consumo&&e.clase!=='cuenta').map(e=>{
    const s=saldo(e)+(extra[e.id]||0);
    let tipo='rev', minimo=0, pagoFijo=0, r=(e.tasaMensual||0)/100;
    if(e.clase==='prestamo'&&e.modo==='total'){tipo='fijo'; pagoFijo=e.pago*e.dias.length; r=0;}
    else if(e.clase==='prestamo'&&e.modo==='interes'){minimo=-1;}
    else if(e.clase==='tarjeta'){minimo=e.minimo||0;}
    return {id:e.id,nombre:e.nombre,saldo:Math.max(0,s),r,tipo,minimo,pagoFijo,ultimo:!!e.ultimo};
  }).filter(d=>d.saldo>0.5);
  const fin={}, serie=[]; let interes=0, deficit=false, mes=0;
  const inicio=parse(hoy()); const base=new Date(inicio.getFullYear(),inicio.getMonth()+1,1);
  while(deudas.some(d=>d.saldo>0.5)&&mes<120){
    let disp=presupuesto;
    deudas.forEach(d=>{ if(d.saldo>0.5&&d.r>0){const i=d.saldo*d.r; d.saldo+=i; interes+=i;} });
    deudas.forEach(d=>{
      if(d.saldo<=0.5) return;
      let p=0;
      if(d.tipo==='fijo') p=Math.min(d.saldo,d.pagoFijo);
      else if(d.minimo===-1) p=Math.min(d.saldo,d.saldo*d.r/(1+d.r));
      else p=Math.min(d.saldo,d.minimo);
      d.saldo-=p; disp-=p;
    });
    if(disp<-0.5) deficit=true;
    disp=Math.max(0,disp);
    const cand=deudas.filter(d=>d.saldo>0.5&&d.tipo==='rev').sort((a,b)=>{
      if(a.ultimo!==b.ultimo) return a.ultimo?1:-1;
      if(metodo==='avalancha') return (b.r-a.r)||(a.saldo-b.saldo);
      return (a.saldo-b.saldo)||(b.r-a.r);
    });
    for(const d of cand){ if(disp<=0)break; const p=Math.min(d.saldo,disp); d.saldo-=p; disp-=p; }
    deudas.forEach(d=>{ if(d.saldo<=0.5&&fin[d.id]===undefined){fin[d.id]=mes; d.saldo=0;} });
    serie.push(deudas.reduce((a,d)=>a+d.saldo,0));
    mes++;
  }
  const etiqueta=m=>{const d=new Date(base.getFullYear(),base.getMonth()+m,1);return MESES[d.getMonth()]+' '+d.getFullYear();};
  return {meses:mes,interes:r2(interes),fin,deficit,serie,etiqueta,completo:!deudas.some(d=>d.saldo>0.5),orden:Object.keys(fin).sort((a,b)=>fin[a]-fin[b])};
}
function minimosMensuales(){
  return entidades().filter(e=>e.consumo&&e.clase!=='cuenta').reduce((a,e)=>{
    const s=saldo(e); if(s<=0.5) return a;
    if(e.clase==='prestamo'&&e.modo==='total') return a+Math.min(s,e.pago*e.dias.length);
    if(e.clase==='prestamo'&&e.modo==='interes') return a+s*e.tasaMensual/100;
    if(e.clase==='tarjeta') return a+Math.min(s,e.minimo||0);
    return a;
  },0);
}

function utilTotal(){ const t=tarjetas(); const s=t.reduce((a,e)=>a+Math.max(0,saldo(e)),0), l=t.reduce((a,e)=>a+(e.limite||0),0); return {s,l,u:l?s/l*100:0}; }

   SINCRONIZACIÓN CON GOOGLE SHEETS (Apps Script)
   ============================================================ */
let sincronizando=false, estadoSync={tipo:'',texto:''};
function pendientes(){ return Object.values(DB.registros).filter(r=>r._pend); }
async function sincronizar(manual){
  pintarEstadoSync();
  const {url,pin}=DB.conexion;
  if(!url||!pin){ if(manual) toast('Configura la conexión en Ajustes'); return; }
  if(sincronizando) return;
  if(!navigator.onLine){ estadoSync={tipo:'pend',texto:'Sin conexión'}; pintarEstadoSync(); return; }
  sincronizando=true; estadoSync={tipo:'',texto:'Sincronizando…'}; pintarEstadoSync();
  try{
    const envio=pendientes().map(r=>{const c=Object.assign({},r); delete c._pend; return c;});
    const resp=await fetch(url,{method:'POST',body:JSON.stringify({accion:'sync',pin,desde:DB.ultimaSync,registros:envio})});
    const j=await resp.json();
    if(!j.ok) throw new Error(j.error||'Error del servidor');
    envio.forEach(r=>{const l=DB.registros[r.id]; if(l&&l.actualizado===r.actualizado) delete l._pend;});
    (j.registros||[]).forEach(r=>{
      const l=DB.registros[r.id];
      if(!l||(!l._pend&&r.actualizado>=l.actualizado)||(l._pend&&r.actualizado>l.actualizado)) DB.registros[r.id]=r;
    });
    DB.ultimaSync=j.ahora; guardarLocal();
    estadoSync={tipo:'ok',texto:'Sincronizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})};
    if(manual) toast('Datos sincronizados');
    if((j.registros||[]).some(r=>!envio.find(x=>x.id===r.id&&x.actualizado===r.actualizado))) renderSeguro();
  }catch(err){
    estadoSync={tipo:'err',texto:'Error de sincronización'}; console.warn(err);
    if(manual) toast('No se pudo sincronizar: '+err.message);
  }finally{ sincronizando=false; pintarEstadoSync(); }
}
let renderPendiente=false;
function renderSeguro(){
  const a=document.activeElement, ocupado=(a&&a.closest&&a.closest('form'))||!$('#modal').hidden;
  if(ocupado){ renderPendiente=true; toast('Hay datos nuevos de tu otro dispositivo'); } else render();
}
function pintarEstadoSync(){
  const b=$('#estadoSync'); if(!b) return;
  const n=pendientes().length;
  if(!DB.conexion.url){ b.className='estado-sync'; b.textContent=n?n+' sin sincronizar':'Sin conexión configurada'; return; }
  if(estadoSync.tipo==='err'){ b.className='estado-sync err'; b.textContent=estadoSync.texto+(n?' · '+n+' pendientes':''); return; }
  if(n){ b.className='estado-sync pend'; b.textContent=estadoSync.texto==='Sin conexión'?'Sin conexión · '+n+' pendientes':n+' pendientes'; return; }
  b.className='estado-sync'+(estadoSync.tipo==='ok'?' ok':''); b.textContent=estadoSync.texto||'Listo';
}

function vPanel(){

  const flujo=ing-egr-pag-aho; const ut=utilTotal(); const deuda=deudaConsumo();
  const cal=calendario(addDays(t,7)); const venc=cal.filter(c=>c.estado==='vencido'); const prox=cal.filter(c=>c.estado!=='pagado'&&c.estado!=='vencido');

function filaCal(c){

function vistaPreviaEgreso(){

  if(edicion&&DB.registros[edicion]&&DB.registros[edicion].tarjeta===e.id&&DB.registros[edicion].medio==='Tarjeta de crédito') actual-=DB.registros[edicion].monto;

  if(msi>1&&monto) html+=`<div class="peq" style="margin-top:6px">Mensualidad: ${fmt(monto/msi)} durante ${msi} meses. El total ocupa tu línea desde hoy.</div>`;
  if(monto>0){
    if(nuevo>e.limite) html+=`<div class="aviso rojo" style="margin:8px 0 0">Esta compra rebasa el límite de la tarjeta. El banco puede rechazarla o cobrar comisión por sobregiro.</div>`;
    else if(colorUtil(u1)!==colorUtil(u0)) html+=`<div class="aviso ambar" style="margin:8px 0 0">Con esta compra la tarjeta pasa a ${colorUtil(u1)==='rojo'?'más del 70%':'más del 30%'} de utilización, lo que afecta tu score.</div>`;
    if(e.tasaMensual>0){
      const B=config().presupuestoDeuda, a=simular(B,'avalancha'), b=simular(B,'avalancha',{[e.id]:monto});
      const dm=(b.fin[e.id]??b.meses)-(a.fin[e.id]??a.meses), di=b.interes-a.interes;
      html+=`<div class="aviso ambar" style="margin:8px 0 0">El plan avalancha supone no comprar con ${esc(e.nombre)}. Esta compra agrega unos ${fmt0(di)} de intereses${dm>0?` y retrasa su liquidación ${dm} mes(es)`:''}.</div>`;
    }
  }
  pv.innerHTML=html; pv.hidden=false;
}

function ayudaPago(){
  const sel=$('#p_entidad'); if(!sel) return;

  const ops=e.modo==='interes'?[['programado','Pago de interés'],['extra','Abono a capital']]:[['programado','Pago programado o mínimo'],['extra','Abono extra']];
  cl.innerHTML=opciones(ops,previo);

  if(e.clase==='tarjeta') t+=` · mínimo ${fmt(e.minimo)} · para no generar intereses ${fmt(e.pagoNoInt)} (último estado)`;
  if(e.modo==='interes') t+=` · interés mensual ${fmt(s*e.tasaMensual/100)}. El pago de interés no baja el saldo; el abono a capital sí.`;
  if(e.modo==='fijo') t+=` · este pago no cambia el saldo registrado; actualízalo con un ajuste cuando tengas el estado de cuenta.`;
  if(monto>s+0.5&&e.modo!=='fijo'&&!(e.modo==='interes'&&cl.value==='programado')) t+=`<div class="aviso ambar" style="margin:8px 0 0">El monto es mayor que el saldo registrado. Revisa el monto o ajusta el saldo.</div>`;
  const dup=activos().find(x=>x.tipo==='pago'&&x.entidad===e.id&&x.fecha===$('#p_fecha').value&&Math.abs(x.monto-monto)<0.01&&x.id!==edicion);
  if(dup) t+=`<div class="aviso ambar" style="margin:8px 0 0">Ya registraste un pago igual en esta fecha. Revisa que no esté duplicado.</div>`;
  $('#p_ayuda').innerHTML=t;
}

function vCalendario(){

  const bloque=(tit,l,vacio)=>`<div class="seccion">${tit}</div><div class="tarjeta">${l.length?`<ul class="lista">${l.map(filaCal).join('')}</ul>`:`<p class="muted">${vacio}</p>`}</div>`;

  return `<div class="aviso azul">Los pagos se generan con las fechas de tus estados de cuenta y contratos. Presiona <b>Registrar</b> para anotarlo con el monto sugerido; puedes cambiarlo antes de guardar.</div>

/* ---------- TARJETAS ---------- */

    ${(()=>{const t=tarjetas().filter(e=>e.id!=='nu');const s=t.reduce((a,e)=>a+Math.max(0,saldo(e)),0),l=t.reduce((a,e)=>a+e.limite,0);const u=s/l*100;return `<div class="tarjeta kpi"><div class="etq">Utilización sin Nu</div><div class="val num">${pct(u)}</div>${barraUtil(u)}<div class="sub">${fmt0(s)} de ${fmt0(l)}</div></div>`})()}
    ${kpi('Meta recomendada','Menos de 30%','Verde < 30% · Amarillo 30–70% · Rojo > 70%')}
  </div>
  <div class="rejilla r2" style="margin-top:14px">${tarjetas().map(e=>{
    const s=saldo(e),u=utilizacion(e,s),dc=compraDespuesCorte(e);

    return `<div class="tarjeta"><div class="fila"><h3 style="margin:0">${esc(e.nombre)}</h3>${chipUtil(u)}</div>
      <div class="fila" style="margin-top:10px"><span class="muted">Saldo</span><span class="num" style="font-size:20px;font-weight:600;color:var(--navy)">${fmt(s)}</span></div>
      ${barraUtil(u)}
      <table style="margin-top:10px"><tbody>
        <tr><td>Límite</td><td class="der num">${fmt(e.limite)}</td></tr>
        <tr><td>Disponible</td><td class="der num ${e.limite-s<0?'neg':''}">${fmt(e.limite-s)}</td></tr>

        ${e.corte?`<tr><td>Corte / límite de pago</td><td class="der">Día ${e.corte} / día ${e.dias[0]}</td></tr>`:''}
        ${e.corte?`<tr><td>Compras después del último corte</td><td class="der num">${fmt(dc)}</td></tr>`:''}
        <tr><td>Tasa anual</td><td class="der">${e.tasaAnual?e.tasaAnual+'%':'—'}</td></tr>
        <tr><td>Estado</td><td class="der">${esc(e.estado)}</td></tr>
      </tbody></table>
      ${msi.length?`<h4>Compras a meses registradas</h4><ul class="lista">${msi.map(x=>`<li><div class="crece peq">${esc(x.r.nota||x.r.categoria)} · ${x.rest} de ${x.r.msi} meses restantes</div><div class="num">${fmt(x.r.monto/x.r.msi)}/mes</div></li>`).join('')}</ul>`:''}
      <p class="peq" style="margin:10px 0">Saldo base: ${esc(e.fuente)}. Último saldo confirmado: ${fFecha(fechaConciliacion(e))}.</p>
      <div class="botones"><button class="btn sec peq" data-ajuste="${e.id}">Ajustar con estado de cuenta</button>${e.seleccionable?`<button class="btn sec peq" data-pagar="${e.id}" data-monto="${montoSugerido(e)}" data-fecha="${hoy()}">Registrar pago</button>`:''}<button class="btn-link" data-editarent="${e.id}">Datos</button></div>

/* ---------- PRÉSTAMOS ---------- */
function vPrestamos(){
  const grupo=(tit,l)=>`<div class="seccion">${tit}</div><div class="rejilla r2">${l.map(e=>{
    const s=saldo(e); const pagado=e.totalPagar?e.totalPagar-s:0; const av=e.totalPagar?pagado/e.totalPagar*100:0;
    return `<div class="tarjeta"><div class="fila"><h3 style="margin:0">${esc(e.nombre)}</h3><span class="chip ${/atraso|cobranza/i.test(e.estado)?'rojo':/solo/i.test(e.estado)?'ambar':'gris'}">${esc(e.estado)}</span></div>
      <div class="fila" style="margin-top:10px"><span class="muted">${e.modo==='total'?'Por pagar (con intereses)':'Saldo'}</span><span class="num" style="font-size:20px;font-weight:600;color:var(--navy)">${fmt(s)}</span></div>
      ${e.totalPagar?`<div class="barra navy"><i style="width:${Math.min(100,av)}%"></i></div><div class="peq" style="margin-top:4px">Pagado ${pct(av)} de ${fmt(e.totalPagar)} (te prestaron ${fmt(e.otorgado)})</div>`:''}
      <table style="margin-top:10px"><tbody>
        ${e.pago?`<tr><td>${e.modo==='interes'?'Interés mensual':'Pago'}</td><td class="der num">${fmt(e.modo==='interes'?s*e.tasaMensual/100:e.pago)}${e.dias&&e.dias.length>1?' quincenal':e.id==='fonacot'?' por quincena':' mensual'}</td></tr>`:''}
        ${e.dias&&e.dias.length?`<tr><td>Días de pago</td><td class="der">${e.dias.join(' y ')}</td></tr>`:''}
        ${e.fin?`<tr><td>Termina</td><td class="der">${fFecha(e.fin)}</td></tr>`:''}
        ${e.tasaMensual?`<tr><td>Costo mensual estimado</td><td class="der">${e.tasaMensual}%</td></tr>`:''}
      </tbody></table>
      <p class="peq" style="margin:10px 0">${esc(e.fuente)}</p>
      <div class="botones">${e.modo!=='fijo'||e.dias.length?`<button class="btn sec peq" data-pagar="${e.id}" data-monto="${montoSugerido(e)}" data-fecha="${hoy()}">Registrar pago</button>`:''}<button class="btn sec peq" data-ajuste="${e.id}">Ajustar saldo</button><button class="btn-link" data-editarent="${e.id}">Datos</button></div>
    </div>`}).join('')}</div>`;
  const p=prestamos();
  return grupo('Préstamos de aplicaciones',p.filter(e=>e.grupo==='app'))+grupo('Préstamos personales',p.filter(e=>e.grupo==='personal'))+grupo('Otros compromisos',p.filter(e=>e.grupo==='otro'))+
    `<div class="botones" style="margin-top:16px"><button class="btn sec" data-accion="nuevaDeuda">Agregar préstamo nuevo</button></div>`;
}

/* ---------- PLAN AVALANCHA ---------- */
function vPlan(){
  const B=config().presupuestoDeuda, a=simular(B,'avalancha'), b=simular(B,'bola'), min=minimosMensuales();
  const deudas=entidades().filter(e=>e.consumo&&e.clase!=='cuenta'&&saldo(e)>0.5);
  const ordenAv=deudas.filter(e=>!(e.clase==='prestamo'&&e.modo==='total')).sort((x,y)=>(!!x.ultimo-!!y.ultimo)||((y.tasaMensual||0)-(x.tasaMensual||0))||(saldo(x)-saldo(y)));
  const fijos=deudas.filter(e=>e.clase==='prestamo'&&e.modo==='total');
  const maxS=Math.max(...a.serie,1);
  const pts=a.serie.map((v,i)=>`${(i/(Math.max(a.serie.length-1,1)))*100},${40-v/maxS*38}`).join(' ');
  return `
  <div class="tarjeta"><form class="formulario" data-form="presupuesto" novalidate><div class="rejilla r2" style="align-items:end">
    ${campo('Presupuesto mensual para deudas (sin hipoteca ni Fonacot)',`<input type="number" step="0.01" min="0" name="presupuesto" id="pl_pres" value="${B}">`,'pl_pres')}

    <p class="peq" style="margin:8px 0 0">Pagos mínimos actuales: ${fmt(min)} al mes. Lo que sobra se manda a la deuda con mayor costo.</p>
  </div>
  ${a.deficit?`<div class="aviso rojo" style="margin-top:12px">El presupuesto no alcanza para cubrir todos los mínimos en algún mes. Súbelo o el plan se retrasa.</div>`:''}
  <div class="rejilla r3" style="margin-top:14px">
    ${kpi('Libre de deudas de consumo',a.completo?a.etiqueta(a.meses-1):'Más de 10 años','Avalancha','verde')}
    ${kpi('Intereses estimados',fmt0(a.interes),'Avalancha, deudas con tasa')}
    ${kpi('Ahorro frente a bola de nieve',fmt0(b.interes-a.interes),'Bola de nieve: '+fmt0(b.interes)+(b.completo?' · termina '+b.etiqueta(b.meses-1):''))}
  </div>
  <div class="tarjeta" style="margin-top:14px"><h3>Deuda total proyectada</h3>
    <svg viewBox="0 0 100 42" preserveAspectRatio="none" style="width:100%;height:120px;display:block"><polyline points="${pts}" fill="none" stroke="#1E4E8C" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
    <div class="fila peq"><span>${a.etiqueta(0)}</span><span>${a.completo?a.etiqueta(a.meses-1):''}</span></div>
  </div>
  <div class="seccion">Orden de ataque (avalancha)</div>
  <div class="tarjeta tabla-scroll"><table><thead><tr><th>#</th><th>Deuda</th><th class="der">Saldo</th><th class="der">Costo mensual</th><th class="der">Liquidación</th></tr></thead><tbody>
    ${ordenAv.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.nombre)}${e.ultimo?' <span class="chip ambar">negociar</span>':''}</td><td class="der num">${fmt0(saldo(e))}</td><td class="der">${e.tasaMensual?e.tasaMensual+'%':'0%'}</td><td class="der">${a.fin[e.id]!==undefined?a.etiqueta(a.fin[e.id]):'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="seccion">Pagos fijos que terminan solos</div>
  <div class="tarjeta tabla-scroll"><table><thead><tr><th>Préstamo</th><th class="der">Por pagar</th><th class="der">Pago</th><th class="der">Termina</th></tr></thead><tbody>
    ${fijos.map(e=>`<tr><td>${esc(e.nombre)}</td><td class="der num">${fmt0(saldo(e))}</td><td class="der num">${fmt(e.pago)}${e.dias.length>1?' ×2':''}</td><td class="der">${fFecha(e.fin)}</td></tr>`).join('')}
  </tbody></table><p class="peq" style="margin:8px 0 0">En estos préstamos el saldo ya incluye intereses; el plan no les manda abonos extra.</p></div>`;
}

/* ---------- AHORRO ---------- */
function cuotaEsperada(desde,hasta){
  const sem=Math.max(0,Math.floor(diasEntre(desde,hasta)/7)+1); let t=0;
  for(let i=1;i<=Math.min(sem,52);i++) t+=i<=13?500:i<=26?750:1000;
  return {sem:Math.min(sem,52),t};
}
function vAhorro(){
  const c=config(); const movs=activos().filter(r=>r.tipo==='ahorro');
  const saldoMeta=id=>suma(movs.filter(r=>r.meta===id&&!r.retiro))-suma(movs.filter(r=>r.meta===id&&r.retiro));
  const total=c.metas.reduce((a,m)=>a+saldoMeta(m.id),0);
  const esp=cuotaEsperada(c.ahorroInicio,hoy());
  const q=hoy()>=c.fondoNomina.desde?(()=>{let n=0,d=parse(c.fondoNomina.desde);const h=parse(hoy());while(d<=h){[10,25].forEach(x=>{const f=new Date(d.getFullYear(),d.getMonth(),x);if(f>=parse(c.fondoNomina.desde)&&f<=h)n++;});d=new Date(d.getFullYear(),d.getMonth()+1,1);}return n})():0;
  const tramo=esp.sem<=13?500:esp.sem<=26?750:1000;
  return `<div class="rejilla r3">
    ${kpi('Ahorro en efectivo',fmt(total),'Suma de tus metas',total>=esp.t?'verde':'ambar')}
    ${kpi('Esperado a la fecha',fmt0(esp.t),hoy()<c.ahorroInicio?'El plan empieza el '+fFecha(c.ahorroInicio):'Semana '+esp.sem+' de 52 · cuota actual '+fmt0(tramo)+'/semana')}
    ${kpi('Fondo de ahorro por nómina (estimado)',fmt0(q*c.fondoNomina.porQuincena),q+' quincenas desde '+fFecha(c.fondoNomina.desde)+'. Se paga en julio.')}
  </div>
  <div class="rejilla r2" style="margin-top:14px">
    <div class="tarjeta"><h3>Registrar movimiento de ahorro</h3>
      <form class="formulario" data-form="ahorro" novalidate>
        <div class="rejilla r2">${campo('Fecha',`<input type="date" name="fecha" id="a_fecha" value="${hoy()}">`,'a_fecha')}${campo('Monto',`<input type="number" step="0.01" min="0" inputmode="decimal" name="monto" id="a_monto" placeholder="0.00">`,'a_monto')}</div>
        <div class="rejilla r2">${campo('Meta',`<select name="meta" id="a_meta">${opciones(c.metas.map(m=>[m.id,m.nombre]))}</select>`,'a_meta')}${campo('Movimiento',`<select name="retiro" id="a_retiro">${opciones([['0','Aportación'],['1','Retiro']])}</select>`,'a_retiro')}</div>
        ${campo('Cuenta',`<select name="cuenta" id="a_cuenta">${opciones(cuentas().map(x=>[x.id,x.nombre]),'efectivo')}</select>`,'a_cuenta')}
        <div class="botones"><button class="btn verde" type="submit">Guardar</button></div>
      </form>
    </div>
    <div class="tarjeta"><h3>Metas</h3>${c.metas.map(m=>{const s=saldoMeta(m.id),u=m.meta?s/m.meta*100:0;return `<div style="margin-bottom:14px"><div class="fila"><b>${esc(m.nombre)}</b><span class="num">${fmt0(s)} de ${fmt0(m.meta)}</span></div><div class="barra"><i style="width:${Math.min(100,u)}%"></i></div><div class="peq" style="margin-top:4px">${pct(u)} · fecha objetivo ${fFecha(m.fecha)}</div></div>`}).join('')}
      <p class="peq">Cuotas del plan: semanas 1–13 $500, 14–26 $750, 27–52 $1,000. Hitos: $6,500 al 10-ene-2027, $16,250 al 11-abr-2027 y $42,250 al 10-oct-2027.</p>
    </div>
  </div>
  <div class="seccion">Movimientos</div>
  <div class="tarjeta">${movs.length?`<ul class="lista">${movs.sort(ordenFecha).reverse().map(r=>`<li><div style="width:60px" class="peq">${fCorta(r.fecha)}</div><div class="crece"><div class="tit">${esc((c.metas.find(m=>m.id===r.meta)||{}).nombre||r.meta)}</div><div class="peq">${r.retiro?'Retiro':'Aportación'} · ${esc(ent(r.cuenta)?ent(r.cuenta).nombre:'')}</div></div><div class="monto num ${r.retiro?'neg':'pos'}">${fmt(r.monto)}</div><button class="btn-link rojo" data-borrar="${r.id}">Borrar</button></li>`).join('')}</ul>`:'<p class="muted">Sin movimientos todavía.</p>'}</div>`;
}

      <div class="vista-previa" id="aj_dif">Saldo calculado al día de hoy: <b>${fmt(saldo(e))}</b></div>
      ${campo('¿A qué se debe la diferencia?',`<select name="clasif" id="aj_clasif">${opciones([['interes','Intereses o comisiones'],['gasto','Gasto que no registré'],['correccion','Corrección de saldo']])}</select>`,'aj_clasif')}
      ${e.clase==='tarjeta'?`<div class="rejilla r2">${campo('Pago mínimo nuevo (opcional)',`<input type="number" step="0.01" name="minimo" id="aj_min" placeholder="${e.minimo}">`,'aj_min')}${campo('Pago para no generar intereses (opcional)',`<input type="number" step="0.01" name="noint" id="aj_noint" placeholder="${e.pagoNoInt}">`,'aj_noint')}</div>`:''}
      <div class="botones"><button class="btn" type="submit">Guardar ajuste</button><button type="button" class="btn sec" data-accion="cerrar">Cancelar</button></div>
    </form>`);
}
function modalTraspaso(){
  const op=cuentas().map(c=>[c.id,c.nombre]);
  modal(`<h3>Traspaso entre mis cuentas</h3><form class="formulario" data-form="traspaso" novalidate>
    <div class="rejilla r2">${campo('De',`<select name="origen" id="t_origen">${opciones(op,'bbva')}</select>`,'t_origen')}${campo('A',`<select name="destino" id="t_destino">${opciones(op,'efectivo')}</select>`,'t_destino')}</div>
    <div class="rejilla r2">${campo('Fecha',`<input type="date" name="fecha" id="t_fecha" value="${hoy()}">`,'t_fecha')}${campo('Monto',`<input type="number" step="0.01" inputmode="decimal" name="monto" id="t_monto" placeholder="0.00">`,'t_monto')}</div>
    <p class="peq">Úsalo para retiros en cajero (BBVA a Efectivo) o para pasar dinero entre bancos. No cuenta como gasto.</p>
    <div class="botones"><button class="btn" type="submit">Guardar</button><button type="button" class="btn sec" data-accion="cerrar">Cancelar</button></div></form>`);
}
function modalTopes(){
  const t=config().topes;
  modal(`<h3>Topes mensuales por categoría</h3><form class="formulario" data-form="topes" novalidate>
    ${CATEGORIAS.map((c,i)=>campo(esc(c),`<input type="number" step="1" min="0" name="t${i}" value="${t[c]||0}">`)).join('')}
    <p class="peq">0 significa sin tope.</p>
    <div class="botones"><button class="btn" type="submit">Guardar</button><button type="button" class="btn sec" data-accion="cerrar">Cancelar</button></div></form>`);
}
function modalEntidad(id){
  const e=id?ent(id):{clase:'prestamo',grupo:'personal',modo:'simple',dias:[],tasaMensual:0,pago:0};
  const esT=e.clase==='tarjeta';
  modal(`<h3>${id?'Datos de '+esc(e.nombre):'Agregar préstamo'}</h3><form class="formulario" data-form="entidad" novalidate><input type="hidden" name="id" value="${esc(id||'')}">
    ${campo('Nombre',`<input name="nombre" id="en_nombre" value="${esc(e.nombre||'')}">`,'en_nombre')}
    ${!id?`<div class="rejilla r2">${campo('Saldo actual',`<input type="number" step="0.01" name="saldo" id="en_saldo">`,'en_saldo')}${campo('Tipo',`<select name="grupo">${opciones([['personal','Préstamo personal'],['app','Préstamo de aplicación'],['otro','Otro']])}</select>`)}</div>
      ${campo('Cómo se paga',`<select name="modo">${opciones([['simple','Abonos que bajan el saldo'],['total','Pago fijo (saldo con intereses incluidos)'],['interes','Solo interés mensual']])}</select>`)}`:''}
    ${esT?`<div class="rejilla r2">${campo('Límite de crédito',`<input type="number" step="0.01" name="limite" value="${e.limite}">`)}${campo('Tasa anual %',`<input type="number" step="0.01" name="tasaAnual" value="${e.tasaAnual}">`)}</div>
      <div class="rejilla r2">${campo('Día de corte',`<input type="number" min="1" max="31" name="corte" value="${e.corte||''}">`)}${campo('Día límite de pago',`<input type="number" min="1" max="31" name="dias" value="${(e.dias||[]).join(',')}">`)}</div>`:
      `<div class="rejilla r2">${campo('Pago (cada vez)',`<input type="number" step="0.01" name="pago" value="${e.pago||0}">`)}${campo('Días de pago (ej. 10,25)',`<input name="dias" value="${(e.dias||[]).join(',')}">`)}</div>
      <div class="rejilla r2">${campo('Costo mensual %',`<input type="number" step="0.01" name="tasaMensual" value="${e.tasaMensual||0}">`)}${campo('Termina (opcional)',`<input type="date" name="fin" value="${e.fin||''}">`)}</div>`}
    ${campo('Estado',`<input name="estado" value="${esc(e.estado||'')}">`)}
    <div class="botones"><button class="btn" type="submit">Guardar</button><button type="button" class="btn sec" data-accion="cerrar">Cancelar</button>${id&&!PRE.find(p=>p.id===id)?`<button type="button" class="btn rojo" data-ocultar="${id}">Eliminar</button>`:''}</div></form>`);
}

/* ============================================================
   FORMULARIOS
   ============================================================ */
function err(id,msg){ const el=document.querySelector(`[data-error="${id}"]`); if(el) el.textContent=msg||''; return !msg; }
function limpiarErrores(f){ f.querySelectorAll('.error').forEach(e=>e.textContent=''); }
function numero(v){ const n=parseFloat(String(v).replace(/[$,\s]/g,'')); return isFinite(n)?n:NaN; }
function validarMontoFecha(fd,pref){
  let ok=true; const m=numero(fd.get('monto'));
  if(!(m>0)) ok=err(pref+'_monto','Escribe un monto mayor que cero')&&false;
  if(!fd.get('fecha')) ok=err(pref+'_fecha','Elige una fecha')&&false;
  return ok?m:null;
}
function onSubmit(ev){
  const f=ev.target.closest('form[data-form]'); if(!f) return; ev.preventDefault(); limpiarErrores(f);
  const fd=new FormData(f), tipo=f.dataset.form;
  if(tipo==='ingreso'){
    const m=validarMontoFecha(fd,'i'); if(m===null) return;
    const r=fd.get('id')?Object.assign({},DB.registros[fd.get('id')]):{tipo:'ingreso'};
    Object.assign(r,{fecha:fd.get('fecha'),monto:r2(m),forma:fd.get('forma'),concepto:fd.get('concepto'),cuenta:fd.get('forma')==='Efectivo'?'efectivo':fd.get('cuenta'),nota:fd.get('nota').trim()});
    guardarRegistro(r); toast('Ingreso guardado'); ir('ingresos');
  }
  if(tipo==='egreso'){
    const m=validarMontoFecha(fd,'e'); if(m===null) return;
    const medio=fd.get('medio');
    const r=fd.get('id')?Object.assign({},DB.registros[fd.get('id')]):{tipo:'egreso'};
    Object.assign(r,{fecha:fd.get('fecha'),monto:r2(m),categoria:fd.get('categoria'),medio,nota:fd.get('nota').trim(),
      cuenta:medio==='Efectivo'?'efectivo':(medio==='Tarjeta de crédito'?null:fd.get('cuenta')),
      tarjeta:medio==='Tarjeta de crédito'?fd.get('tarjeta'):null,msi:medio==='Tarjeta de crédito'?+fd.get('msi'):1});
    guardarRegistro(r); toast('Egreso guardado'); ir('egresos');
  }
  if(tipo==='pago'){
    const m=validarMontoFecha(fd,'p'); if(m===null) return;
    const r=fd.get('id')?Object.assign({},DB.registros[fd.get('id')]):{tipo:'pago'};
    Object.assign(r,{fecha:fd.get('fecha'),monto:r2(m),entidad:fd.get('entidad'),cuenta:fd.get('cuenta'),clase:fd.get('clase'),nota:fd.get('nota').trim()});
    guardarRegistro(r); toast('Pago registrado'); ir('pagos');
  }
  if(tipo==='ajuste'){
    const s=numero(fd.get('saldoReal'));
    if(!isFinite(s)) return err('aj_saldo','Escribe el saldo real');
    if(!fd.get('fecha')) return err('aj_fecha','Elige una fecha');
    const e=ent(fd.get('entidad')); const calc=saldo(e,fd.get('fecha'));
    guardarRegistro({tipo:'ajuste',entidad:e.id,fecha:fd.get('fecha'),saldoReal:r2(s),saldoCalculado:calc,diferencia:r2(s-calc),clasif:fd.get('clasif')});
    if(e.clase==='tarjeta'){
      const mn=numero(fd.get('minimo')), ni=numero(fd.get('noint')); const d={};
      if(mn>=0) d.minimo=mn; if(ni>=0) d.pagoNoInt=ni; if(mn>=0&&e.tasaMensual>0) d.pagoSugerido=mn; if(ni>=0&&!e.tasaMensual) d.pagoSugerido=ni;
      if(Object.keys(d).length) guardarEntidad(e.id,d);
    }
    cerrarModal(); toast('Saldo ajustado'); render();
  }
  if(tipo==='traspaso'){
    const m=validarMontoFecha(fd,'t'); if(m===null) return;
    if(fd.get('origen')===fd.get('destino')) return err('t_destino','Elige una cuenta distinta');
    guardarRegistro({tipo:'traspaso',fecha:fd.get('fecha'),monto:r2(m),origen:fd.get('origen'),destino:fd.get('destino')});
    cerrarModal(); toast('Traspaso guardado'); render();
  }
  if(tipo==='topes'){
    const t={}; CATEGORIAS.forEach((c,i)=>{t[c]=Math.max(0,numero(fd.get('t'+i))||0);});
    guardarConfig({topes:t}); cerrarModal(); toast('Topes guardados'); render();
  }
  if(tipo==='presupuesto'){
    const v=numero(fd.get('presupuesto')); if(!(v>0)) return err('pl_pres','Escribe un monto mayor que cero');
    guardarConfig({presupuestoDeuda:r2(v)}); toast('Plan recalculado'); render();
  }
  if(tipo==='buro'){ guardarConfig({buro:{fecha:fd.get('fecha'),score:fd.get('score').trim(),nota:fd.get('nota').trim()}}); toast('Guardado'); render(); }
  if(tipo==='ahorro'){
    const m=validarMontoFecha(fd,'a'); if(m===null) return;
    guardarRegistro({tipo:'ahorro',fecha:fd.get('fecha'),monto:r2(m),meta:fd.get('meta'),retiro:fd.get('retiro')==='1',cuenta:fd.get('cuenta')});
    toast('Movimiento guardado'); render();
  }
  if(tipo==='conexion'){
    const url=fd.get('url').trim(), pin=fd.get('pin').trim();
    if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return err('c_url','Debe ser la dirección que termina en /exec');
    if(url&&!pin) return err('c_pin','Escribe el PIN');
    DB.conexion={url,pin}; DB.ultimaSync=''; Object.values(DB.registros).forEach(r=>r._pend=true); guardarLocal(); sincronizar(true); render();
  }
  if(tipo==='entidad'){
    const id=fd.get('id'); const d={};
    const nombre=fd.get('nombre').trim(); if(!nombre) return err('en_nombre','Escribe un nombre');
    d.nombre=nombre; d.estado=fd.get('estado').trim();
    const dias=String(fd.get('dias')||'').split(',').map(x=>parseInt(x)).filter(x=>x>=1&&x<=31);
    d.dias=dias;
    ['limite','tasaAnual','pago','tasaMensual'].forEach(k=>{if(fd.has(k)){const v=numero(fd.get(k)); if(isFinite(v)) d[k]=v;}});
    if(fd.has('corte')){const v=parseInt(fd.get('corte')); d.corte=v>=1&&v<=31?v:null;}
    if(fd.has('fin')) d.fin=fd.get('fin')||null;
    if(!id){
      const s=numero(fd.get('saldo')); if(!(s>=0)) return err('en_saldo','Escribe el saldo');
      Object.assign(d,{clase:'prestamo',grupo:fd.get('grupo'),modo:fd.get('modo'),saldo:r2(s),fechaBase:hoy(),consumo:true,otorgado:r2(s),pagoSugerido:d.pago||0,fuente:'Agregado el '+fFecha(hoy())});
      guardarEntidad('p'+uid(),d);
    } else guardarEntidad(id,d);
    cerrarModal(); toast('Datos guardados'); render();
  }
}
function guardarEntidad(id,datos){
  const ex=activos().find(r=>r.tipo==='entidad'&&r.entidadId===id);
  const r=ex||{tipo:'entidad',entidadId:id,fecha:hoy()}; r.datos=Object.assign({},ex?ex.datos:{},datos); guardarRegistro(r);
}

/* ============================================================
   EVENTOS
   ============================================================ */
function onClick(ev){
  const b=ev.target.closest('button,[data-ir]'); if(!b) return;
  const d=b.dataset;
  if(d.ir){ ir(d.ir); return; }
  if(d.pagar){ ir('pagos',{prefill:{entidad:d.pagar,monto:+d.monto||'',fecha:hoy()}}); return; }
  if(d.ajuste){ modalAjuste(d.ajuste); return; }
  if(d.editar){ ir(d.v,{edicion:d.editar}); return; }
  if(d.borrar){ if(confirm('¿Borrar este registro?')){ borrarRegistro(d.borrar); toast('Registro borrado'); render(); } return; }
  if(d.editarent){ modalEntidad(d.editarent); return; }
  if(d.ocultar){ if(confirm('¿Eliminar este préstamo?')){ guardarEntidad(d.ocultar,{oculta:true}); cerrarModal(); render(); } return; }
  const a=d.accion;
  if(a==='menu') abrirMenu();
  if(a==='cerrar') cerrarModal();
  if(a==='traspaso') modalTraspaso();
  if(a==='topes') modalTopes();
  if(a==='nuevaDeuda') modalEntidad(null);
  if(a==='sync') sincronizar(true);
  if(a==='exportar') exportar();
  if(a==='limpiar'){ if(confirm('¿Borrar la copia local de este dispositivo?')){ const c=DB.conexion; DB={registros:{},ultimaSync:'',conexion:c}; guardarLocal(); render(); sincronizar(true);} }
}
function onInput(ev){
  const id=ev.target.id;
  if(['e_medio','e_tarjeta','e_monto','e_msi'].includes(id)) vistaPreviaEgreso();
  if(id==='p_entidad'){ $('#p_monto').value=''; $('#p_clase').value=''; ayudaPago(); }
  if(['p_monto','p_fecha','p_clase'].includes(id)) ayudaPago();
  if(id==='i_forma') alternarCuentaIngreso();
  if(id==='aj_saldo'||id==='aj_fecha'){
    const f=$('form[data-form="ajuste"]'); const e=ent(f.entidad.value); const fe=$('#aj_fecha').value||hoy(); const s=numero($('#aj_saldo').value); const c=saldo(e,fe);
    $('#aj_dif').innerHTML=`Saldo calculado al ${fFecha(fe)}: <b>${fmt(c)}</b>`+(isFinite(s)?` · diferencia <b class="${s-c>0?'neg':'pos'}">${fmt(s-c)}</b>`:'');
  }
  if(id==='importar'&&ev.type==='change') importar(ev.target.files[0]);
  if(ev.target.id&&ev.target.closest('form'))err(ev.target.id,'');
}
function exportar(){
  const blob=new Blob([JSON.stringify({version:1,exportado:new Date().toISOString(),registros:Object.values(DB.registros)},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='respaldo-finanzas-'+hoy()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importar(file){
  if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!Array.isArray(o.registros)) throw 0;
      let n=0; o.registros.forEach(r=>{const l=DB.registros[r.id]; if(!l||r.actualizado>l.actualizado){DB.registros[r.id]=Object.assign(r,{_pend:true});n++;}});
      guardarLocal(); toast(n+' registro(s) restaurados'); render(); sincronizar();
    }catch(e){ toast('El archivo no es un respaldo válido'); } };
  rd.readAsText(file);
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('ver'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('ver'),2600); }

/* ============================================================
   INICIO
   ============================================================ */
function entrar(){ $('#portada').hidden=true; $('#app').hidden=false; try{sessionStorage.setItem('rza_entro','1');}catch(e){} render(); sincronizar(); }
cargar();
$('#portada').addEventListener('click',entrar);
$('#portada').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')entrar();});
document.addEventListener('click',onClick);
document.addEventListener('submit',onSubmit);
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
$('#btnMenu').addEventListener('click',abrirMenu);
$('#velo').addEventListener('click',cerrarMenu);
$('#estadoSync').addEventListener('click',()=>DB.conexion.url?sincronizar(true):ir('ajustes'));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')cerrarModal();});
window.addEventListener('online',()=>sincronizar());
window.addEventListener('offline',()=>{estadoSync={tipo:'pend',texto:'Sin conexión'};pintarEstadoSync();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizar();});
setInterval(()=>{if(!document.hidden)sincronizar();},90000);
try{ if(sessionStorage.getItem('rza_entro')) entrar(); }catch(e){}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
